# ============================================================
# 【原生 Gradle 模板】build-native-apk.yml
# 适用：原生 Kotlin/Compose Android 项目（如：橘瓣 OrangeChat）
# 构建：./gradlew :app:assembleDebug
#
# 用法：
#   1. 复制本文件到目标仓库的 .github/workflows/ 下
#   2. 按需调整：
#      - branches：触发分支
#      - sdk_version：compileSdk 版本（默认 37）
#      - 若项目带 React 前端子目录（如 web-ui），
#        取消下方"带前端子项目"注释并改目录名
#   3. push 即自动构建，APK 在 Actions 的 artifact 里下载
# ============================================================

name: Build Native Gradle APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure compileSdk 37 available
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || true

      - name: Clone git submodules
        run: |
          git submodule update --init --recursive || true

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      # ---------------- 带前端子项目时启用（如 web-ui） ----------------
      # - name: Setup Node.js 22
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '22'
      #     cache: 'pnpm'
      #     cache-dependency-path: web-ui/pnpm-lock.yaml
      #
      # - name: Setup pnpm
      #   run: |
      #     npm install -g pnpm@9
      #     pnpm --version
      #
      # - name: Install & build web-ui
      #   working-directory: web-ui
      #   run: |
      #     pnpm install --frozen-lockfile || pnpm install
      #     pnpm run build
      # ------------------------------------------------------------------

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Native-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
