name: Build OrangeChat LiquidGlass APK

on:
  push:
    branches: [ main, master, orangechat-liquid-glass-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure compileSdk 37 available
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || true

      - name: Clone material-color-utilities submodule
        run: |
          rm -rf material3/material-color-utilities
          git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          ls material3/material-color-utilities/kotlin | head -5

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm 10
        run: |
          npm install -g pnpm@10
          pnpm --version

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          pnpm install --frozen-lockfile || pnpm install

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-LiquidGlass-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
